services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ananta
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: ananta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ananta-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ananta -d ananta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ananta-postgres:
